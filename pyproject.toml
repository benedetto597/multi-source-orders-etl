[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-source-orders-etl"
version = "1.0.0"
description = "ETL that consolidates purchase orders from a legacy SQL database and monthly CSV drops into a deduplicated SQLite table."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Edgar Benedetto" }]
dependencies = [
    "pandas>=2.2",
    "SQLAlchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
orders-etl = "orders_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
